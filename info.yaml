# Tiny Tapeout project information
project:
  title: "Eight-lane int8 convolution engine"
  author: "SKY130 KWS project"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "Streaming vector MAC for pointwise and depthwise convolutions"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 25000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "4x2"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module: "tt_um_kws_vec8"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Data bit 0"
  ui[1]: "Data bit 1"
  ui[2]: "Data bit 2"
  ui[3]: "Data bit 3"
  ui[4]: "Data bit 4"
  ui[5]: "Data bit 5"
  ui[6]: "Data bit 6"
  ui[7]: "Data bit 7"

  # Outputs
  uo[0]: "Accumulator byte bit 0"
  uo[1]: "Accumulator byte bit 1"
  uo[2]: "Accumulator byte bit 2"
  uo[3]: "Accumulator byte bit 3"
  uo[4]: "Accumulator byte bit 4"
  uo[5]: "Accumulator byte bit 5"
  uo[6]: "Accumulator byte bit 6"
  uo[7]: "Accumulator byte bit 7"

  # Bidirectional pins
  uio[0]: "Lane bit 0"
  uio[1]: "Lane bit 1"
  uio[2]: "Lane bit 2"
  uio[3]: "Byte index bit 0"
  uio[4]: "Byte index bit 1"
  uio[5]: "Opcode bit 0"
  uio[6]: "Opcode bit 1"
  uio[7]: "Opcode bit 2"

# Do not change!
yaml_version: 6
